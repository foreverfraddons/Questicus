# Release: when the addon changed since the last tag, bump the version (Questicus.toc + Core.lua), tag it,
# add the Questicus Maps art from the pinned OpenMap release, check, package with the BigWigsMods
# packager and upload to CurseForge (when CF_PROJECT_ID is set) and to a GitHub release.
name: Release

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release now (even with fewer than MIN_CHANGES changes, or none)"
        type: boolean
        default: false
      silent:
        description: "Silent: nothing in the in-game What's new (no filler line when the notes are empty)"
        type: boolean
        default: false

permissions:
  contents: write

# CurseForge release type: beta unless the repo variable RELEASE_TYPE says "release" (or "alpha").
# The packager reads it from the tag: v1.2.3-beta is a beta, v1.2.3 a release. The addon's own
# version (Questicus.toc / Core.lua / the patch notes) stays plain 1.2.3.
env:
  RELEASE_TYPE: ${{ vars.RELEASE_TYPE || 'beta' }}
  # a CurseForge update only once the patch notes ("next" in Questicus/Changelog.lua) hold this many
  # different changes (several tries at one fix are one line there); repo variable MIN_CHANGES changes it
  MIN_CHANGES: ${{ vars.MIN_CHANGES || '10' }}

concurrency:
  group: repo-write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything new?
        id: check
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST" ] || [ "${{ inputs.force }}" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet "$LAST" HEAD -- Questicus upstream.json; then
            echo "Nothing changed since $LAST."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MAPS=""
          if ! git diff --quiet "$LAST" HEAD -- upstream.json; then MAPS="--maps"; fi
          N=$(python3 tools/changelog.py count $MAPS)
          if [ "$N" -lt "$MIN_CHANGES" ]; then
            echo "$N of $MIN_CHANGES changes since $LAST - waiting for more before a CurseForge update."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "$N changes since $LAST."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checks
        if: steps.check.outputs.go == 'true'
        run: |
          python3 tools/sync_maps.py check
          python3 tools/changelog.py check
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null
          bad=0
          while IFS= read -r -d '' f; do luac5.1 -p "$f" || bad=1; done < <(find Questicus -name '*.lua' -print0)
          exit $bad

      - name: Bump version and tag
        if: steps.check.outputs.go == 'true'
        id: ver
        run: |
          CUR=$(grep -m1 '^## Version:' Questicus/Questicus.toc | sed 's/## Version: *//')
          LASTFULL=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          LASTTAG=$(echo "$LASTFULL" | sed 's/^v//; s/-\(beta\|alpha\)$//')
          if [ -n "$LASTTAG" ] && [ "$LASTTAG" = "$CUR" ] || git rev-parse -q --verify "refs/tags/v$CUR" > /dev/null \
             || git rev-parse -q --verify "refs/tags/v$CUR-beta" > /dev/null || git rev-parse -q --verify "refs/tags/v$CUR-alpha" > /dev/null; then
            # (patch number in three digits: 0.9.021, 0.9.022 ... 0.9.999)
            IFS=. read -r MA MI PA <<< "$CUR"; NEW="$MA.$MI.$(printf '%03d' $(( 10#${PA:-0} + 1 )))"
          else
            NEW="$CUR"                      # a version set by hand that wasn't released yet
          fi
          sed -i "s/^## Version:.*/## Version: $NEW/" Questicus/Questicus.toc
          sed -i "s/^Q.version = \".*\"/Q.version = \"$NEW\"/" Questicus/Core.lua
          # patch notes: the "next" entry becomes this version (a maps-only release gets a map line)
          MAPS=""
          if [ -n "$LASTFULL" ] && ! git diff --quiet "$LASTFULL" HEAD -- upstream.json 2>/dev/null; then MAPS="--maps"; fi
          SILENT=""
          if [ "${{ inputs.silent }}" = "true" ]; then SILENT="--silent"; fi
          python3 tools/changelog.py stamp "$NEW" $MAPS $SILENT
          git config user.name "questicus bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Release v$NEW" || true
          TAG="v$NEW"
          case "$RELEASE_TYPE" in beta|alpha) TAG="v$NEW-$RELEASE_TYPE" ;; esac
          git tag "$TAG"
          git push origin HEAD "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Release $TAG ($RELEASE_TYPE)"

      - name: Add the Questicus Maps art
        if: steps.check.outputs.go == 'true'
        run: |
          REPO=$(python3 -c "import json;print(json.load(open('upstream.json'))['repo'])")
          TAG=$(python3 -c "import json;print(json.load(open('upstream.json'))['tag'])")
          git clone -q --depth 1 --branch "$TAG" --filter=blob:none --sparse "https://github.com/$REPO.git" /tmp/upstream
          (cd /tmp/upstream && git sparse-checkout set --no-cone '/OpenMap/Media/Textures/Forever/' '/OpenMap/Media/Textures/GroupRing.tga')
          python3 tools/sync_maps.py art /tmp/upstream
          du -sh Questicus/Media/Textures
          # the packager leaves out files git doesn't track: commit the art here (this commit is never
          # pushed - the repo stays small) and move the release tag onto it, so the package is still the release
          python3 tools/changelog.py md "${{ steps.ver.outputs.version }}" > CHANGELOG.md
          cat CHANGELOG.md
          git add -f Questicus/Media/Textures CHANGELOG.md
          git commit -qm "Questicus Maps art (OpenMap $TAG) - packaging only"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git ls-files Questicus/Media/Textures | wc -l

      - name: Package and upload (CurseForge + GitHub release)
        if: steps.check.outputs.go == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ vars.CF_PROJECT_ID != '' && format('-p {0}', vars.CF_PROJECT_ID) || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
